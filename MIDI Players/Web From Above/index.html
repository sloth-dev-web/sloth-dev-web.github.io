<body>
  <button id="settingsToggle" class="settings-toggle-btn" title="Settings (Esc)"><i class="fa-solid fa-gear"></i></button>
  <div class="overlay" id="settingsOverlay"></div>

   <div id="statusOverlay" style="position:fixed;top:0;right:0;width:156px;background:rgba(0,0,0,0.5);color:#fff;font:11px 'Consolas',monospace;padding:3px 6px;z-index:490;pointer-events:none;box-sizing:border-box;"></div>
   <div id="messageOverlay" style="position:fixed;left:0;right:0;top:28%;background:rgba(0,0,0,0.25);color:#fff;font:14px 'Segoe UI',sans-serif;padding:10px 16px;text-align:center;text-shadow:2px 2px 0 #404040;z-index:490;pointer-events:none;display:none;white-space:pre-line;"></div>
   <div id="top10Overlay" style="position:fixed;left:0;right:0;background:rgba(0,0,0,0.25);color:#fff;font:11px 'Consolas',monospace;padding:6px 10px;z-index:490;pointer-events:none;display:none;"></div>

  <div id="loadingScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:10000;flex-direction:column;align-items:center;justify-content:center;color:#FF6B6B;font-family:'Segoe UI',sans-serif;">
     <div style="font-size:48px;margin-bottom:20px;">⏳</div>
     <div style="font-size:24px;font-weight:600;">Loading...</div>
     <div id="loadingText" style="font-size:14px;color:#aaa;margin-top:10px;"></div>
  </div>

  <div id="errorPopup" class="error-popup">
      <span id="errorPopupText"></span>
  </div>

  <div class="settings-panel" id="settingsPanel"><!-- built by ui.js from the settings schema --></div>

<canvas id="c"></canvas>

<script src="js/sf2-parser.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
